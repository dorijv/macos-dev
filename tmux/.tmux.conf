set -g base-index 1
set -g status-position top
set -g mouse on
set -g mode-keys vi

# Claude Code's process is named after its version (e.g. 2.1.310); show "claude" instead
set -g automatic-rename-format '#{?#{m/r:^[0-9.]+$,#{pane_current_command}},claude,#{pane_current_command}}'

# Plugins (prefix + I installs them)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Catppuccin is installed outside tpm, as its docs recommend (see install.sh)
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style "basic"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"
# Each window number gets its own colour, cycling through six by window index
set -g @win_colour "#{?#{==:#{e|m:#{window_index},6},1},#{@thm_red},#{?#{==:#{e|m:#{window_index},6},2},#{@thm_peach},#{?#{==:#{e|m:#{window_index},6},3},#{@thm_yellow},#{?#{==:#{e|m:#{window_index},6},4},#{@thm_green},#{?#{==:#{e|m:#{window_index},6},5},#{@thm_blue},#{@thm_mauve}}}}}}"
set -g @catppuccin_window_number_color "#{E:@win_colour}"
set -g @catppuccin_window_current_number_color "#{E:@win_colour}"
set -g @catppuccin_date_time_text " %H:%M:%S"
set -g @catppuccin_status_left_separator "█"
set -g @catppuccin_status_right_separator "█"
run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux

# Status modules must be set after catppuccin has loaded
set -g status-left ""
set -g status-right-length 100
set -g status-right "#{E:@catppuccin_status_application}#{E:@catppuccin_status_session}#{E:@catppuccin_status_user}#{E:@catppuccin_status_host}#{E:@catppuccin_status_date_time}"

run '~/.tmux/plugins/tpm/tpm'
