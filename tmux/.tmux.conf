set -g base-index 1
set -g status-position top
set -g mouse on
set -g mode-keys vi

# Plugins (prefix + I installs them)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'   # Ctrl-h/j/k/l across tmux panes and nvim splits

# Catppuccin is installed outside tpm, as its docs recommend (see install.sh)
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style "custom"
set -g @catppuccin_window_left_separator ""
set -g @catppuccin_window_middle_separator " | "
set -g @catppuccin_window_right_separator "█ "
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_current_number_color "#d20f39"
set -g @catppuccin_date_time_text " %H:%M:%S"
set -g @catppuccin_status_left_separator "█"
set -g @catppuccin_status_right_separator "█"
run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux

# Status modules must be set after catppuccin has loaded
set -g status-left ""
set -g status-right-length 100
set -g status-right "#{E:@catppuccin_status_application}#{E:@catppuccin_status_session}#{E:@catppuccin_status_user}#{E:@catppuccin_status_host}#{E:@catppuccin_status_date_time}"

run '~/.tmux/plugins/tpm/tpm'
